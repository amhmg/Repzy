<!-- Supabase → Authentication → Emails → "Reset Password" template.
     Subject: Your Repzy password reset code
     Paste the HTML below as the message body. {{ .Token }} is the code the app asks for. -->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #111;">
  <h2 style="color: #FF5A1F; margin: 0 0 12px;">Repzy</h2>
  <p>Someone asked to reset the password for your Repzy account.</p>
  <p>Enter this code in the app:</p>
  <p style="font-size: 32px; font-weight: 800; letter-spacing: 6px; margin: 16px 0;">{{ .Token }}</p>
  <p style="color: #666; font-size: 13px;">The code expires in 1 hour. If you didn't ask for this, you can ignore this email; your password won't change.</p>
</div>
